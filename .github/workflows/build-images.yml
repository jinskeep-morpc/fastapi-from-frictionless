name: Build and push base images

# Runs after "Publish to PyPI" completes so pip install gets the new version.
# Can also be triggered manually with an explicit version tag.
on:
  workflow_run:
    workflows: ["Publish to PyPI"]
    types: [completed]
  workflow_dispatch:
    inputs:
      version:
        description: "Version tag to apply (e.g. 0.2.3)"
        required: true

env:
  REGISTRY: ghcr.io
  GENERATOR_IMAGE: ghcr.io/${{ github.repository_owner }}/fastapi-from-frictionless-generator
  RUNTIME_IMAGE: ghcr.io/${{ github.repository_owner }}/fastapi-from-frictionless-runtime

jobs:
  build-and-push:
    # For workflow_run: only run when publish succeeded.
    # For workflow_dispatch: always run.
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.ref || github.event.workflow_run.head_sha }}

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve version tag
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            TAG="${{ github.event.workflow_run.head_branch }}"
            echo "tag=${TAG#v}" >> "$GITHUB_OUTPUT"
          fi

      - name: Wait for version to be available on PyPI
        run: |
          VERSION="${{ steps.version.outputs.tag }}"
          echo "Waiting for fastapifromfrictionless==${VERSION} on PyPI..."
          for i in $(seq 1 24); do
            if pip index versions fastapifromfrictionless 2>/dev/null | grep -q "${VERSION}"; then
              echo "Version ${VERSION} is available."
              exit 0
            fi
            echo "Attempt ${i}/24: not yet available, waiting 30s..."
            sleep 30
          done
          echo "ERROR: Version ${VERSION} not visible on PyPI after 12 minutes."
          exit 1

      - name: Build and push generator base image
        uses: docker/build-push-action@v6
        with:
          context: podman
          file: podman/Dockerfile.generator-base
          push: true
          build-args: PACKAGE_VERSION=${{ steps.version.outputs.tag }}
          tags: |
            ${{ env.GENERATOR_IMAGE }}:latest
            ${{ env.GENERATOR_IMAGE }}:${{ steps.version.outputs.tag }}

      - name: Build and push runtime base image
        uses: docker/build-push-action@v6
        with:
          context: podman
          file: podman/Dockerfile.runtime-base
          push: true
          build-args: PACKAGE_VERSION=${{ steps.version.outputs.tag }}
          tags: |
            ${{ env.RUNTIME_IMAGE }}:latest
            ${{ env.RUNTIME_IMAGE }}:${{ steps.version.outputs.tag }}

fields:
  - name: deployment_name
    type: string
  - name: contact_fullname
    type: string
primaryKey: [deployment_name, contact_fullname]
foreignKeys:
  - fields:
      - deployment_name
    reference:
      resource: deployment
      fields:
        - name
  - fields:
      - contact_fullname
    reference:
      resource: contact
      fields:
        - fullname
fields:
  - name: name
    type: string
    constraints:
      required: true
  - name: sensor_name
    type: string
    constraints:
      required: true
  - name: sensor_index
    type: integer
  - name: start_date
    type: date
  - name: end_date
    type: date
primaryKey:
  - name
foreignKeys:
  - fields:
      - sensor_name
    reference:
      resource: sensor
      fields:
        - name
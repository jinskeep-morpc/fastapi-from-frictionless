fields:
  - name: name
    type: string
    constraints:
      required: true
  - name: sensor_name
    type: string
    constraints:
      required: true
  - name: sensor_index
    type: integer
  - name: start_date
    type: date
  - name: end_date
    type: date
  - name: location_address
    type: string
  - name: contact_fullname
    type: string
  - name: hotspot_macaddr
    type: string
primaryKey:
  - name
foreignKeys:
  - fields:
      - sensor_name
    reference:
      resource: sensor
      fields:
        - name
  - fields:
      - location_address
    reference:
      resource: location
      fields:
        - address
  - fields:
      - hotspot_macaddr
    reference:
      resource: hotspot
      fields:
        - macaddr
  - fields:
      - contact_fullname
    reference:
      resource: contact
      fields:
        - fullname
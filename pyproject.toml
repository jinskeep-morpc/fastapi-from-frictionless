[project]
name = "fastapifromfrictionless"
dynamic = ["version"]
description = "Creating FastAPIs from Frictionless Data Packages"
authors = [
    {name = "MORPC data team", email = "dataandmaps@morpc.org"},
    {name = "Jordan Inskeep", email = "jinskeep@morpc.org"}
]

license = "MIT"
readme = "README.md"
requires-python = ">=3.10"
classifiers = [
    "Development Status :: 1 - Planning",
    "Intended Audience :: Developers",
]

dependencies = [
    "requests",
    "pandas",
    "frictionless",
    "SQLmodel",
    "FastAPI",
    "fastapi_querybuilder",
    "sqlalchemy",
    "xlsxwriter",
    "jinja2",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
    "mypy",
]

[project.scripts]
fastapifromfrictionless = "fastapifromfrictionless.cli:main"

[build-system]
requires = ["setuptools>=61.0", "setuptools-scm"]
build-backend = "setuptools.build_meta"

[tool.setuptools.dynamic]
version = {attr = "fastapifromfrictionless.__version__"}

[tool.setuptools_scm]
# When a git tag like v0.1.0 is present, setuptools-scm infers the version.
# The write_to field is omitted — version is read from __version__ in __init__.py
# for now; switch to write_to = "fastapifromfrictionless/_version.py" when ready.

[tool.setuptools.packages.find]
exclude = ["demo"] 
namespaces = false

[tool.setuptools.package-data]
"*" = ["*.json"]
fastapifromfrictionless = ["templates/*.jinja2"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100
exclude = ["doc/"]

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = [
    "E501",   # line too long — enforced by formatter, not linter
    "E402",   # module-level import not at top of file — intentional in __init__.py
    "F403",   # star import — intentional re-export in __init__.py
    "F401",   # unused import — many are intentional re-exports; clean up separately
]

[tool.mypy]
ignore_missing_imports = true
no_strict_optional = true
exclude = ["doc/"]
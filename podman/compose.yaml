# compose.yaml
#
# Two services: PostGIS database and the generated FastAPI application.
# Copy this file, Dockerfile, entrypoint.sh, and .env.example to your
# deployment folder, then follow the README to get started.

services:
  postgres:
    image: docker.io/postgis/postgis
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    volumes:
      - ./postgres:/var/lib/postgresql/data:Z
    ports:
      - 5432:5432
    networks:
      app_network:
        ipv4_address: 10.91.0.5
        aliases:
          - postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-*}
      - API_KEY=${API_KEY}
      - SCHEMA_FOLDER=/schemas
      - API_URL=${API_URL:-http://localhost:8000}
    volumes:
      - ./schemas:/schemas:Z
    ports:
      - 8000:8000
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      app_network:
        ipv4_address: 10.91.0.6
        aliases:
          - api

networks:
  app_network:
    driver: bridge
    ipam:
      config:
        - subnet: 10.91.0.0/16
          ip_range: 10.91.0.0/24
          gateway: 10.91.0.1

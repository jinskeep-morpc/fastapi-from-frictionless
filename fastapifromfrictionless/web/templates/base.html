<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Data{% endblock %}</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/htmx/2.0.4/htmx.min.js"
        integrity="sha512-2kIcAizYXhIn8TzUvqzEDZNuDZ+aW7yE/+f1HJHXFjQcGNfv1kqzJSTBRBSlOgp6B/KZsz1K0a3ZTqP9dnxioQ=="
        crossorigin="anonymous" referrerpolicy="no-referrer"></script>
<style>
  :root {
    --bg:#ffffff; --fg:#1b1f23; --muted:#5b6670; --line:#d8dee4;
    --accent:#0b5cad; --accent-fg:#ffffff; --err:#b3261e; --row:#f6f8fa;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg:#0f1418; --fg:#e6edf3; --muted:#9aa7b2; --line:#2b333b;
      --accent:#4c9be8; --accent-fg:#06121d; --err:#f28b82; --row:#161c22;
    }
  }
  :root[data-theme="dark"] {
    --bg:#0f1418; --fg:#e6edf3; --muted:#9aa7b2; --line:#2b333b;
    --accent:#4c9be8; --accent-fg:#06121d; --err:#f28b82; --row:#161c22;
  }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); font:15px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif; }
  header { display:flex; gap:1rem; align-items:baseline; padding:.8rem 16px;
           border-bottom:1px solid var(--line); flex-wrap:wrap; }
  header a.home { font-weight:600; color:var(--fg); text-decoration:none; }
  header .who { margin-left:auto; color:var(--muted); font-size:.85rem; }
  main { padding:1.2rem 16px; max-width:1100px; margin:0 auto; }
  h1 { font-size:1.3rem; margin:0 0 1rem; }
  a { color:var(--accent); }
  table { border-collapse:collapse; width:100%; font-size:.9rem; }
  th, td { text-align:left; padding:.45rem .6rem; border-bottom:1px solid var(--line);
           white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:22ch; }
  th { color:var(--muted); font-weight:600; }
  tr:hover td { background:var(--row); }
  .btn { display:inline-block; padding:.4rem .8rem; border:1px solid var(--line);
         border-radius:6px; background:var(--bg); color:var(--fg); cursor:pointer;
         font:inherit; text-decoration:none; }
  .btn.primary { background:var(--accent); color:var(--accent-fg); border-color:transparent; }
  .btn.danger { color:var(--err); border-color:var(--err); }
  .grid { display:grid; gap:.9rem; grid-template-columns:repeat(auto-fill,minmax(230px,1fr)); }
  .card { border:1px solid var(--line); border-radius:8px; padding:.9rem; text-decoration:none;
          color:var(--fg); display:block; }
  .card b { display:block; }
  .card span { color:var(--muted); font-size:.85rem; }
  label { display:block; margin:.8rem 0 .2rem; font-size:.85rem; color:var(--muted); }
  input[type=text], input[type=number], input[type=date], input[type=datetime-local], select {
    width:100%; padding:.45rem .55rem; border:1px solid var(--line); border-radius:6px;
    background:var(--bg); color:var(--fg); font:inherit; }
  .req::after { content:" *"; color:var(--err); }
  .err { color:var(--err); margin:.8rem 0; white-space:pre-wrap; font-size:.85rem; }
  .muted { color:var(--muted); }
  .actions { display:flex; gap:.5rem; margin-top:1.2rem; align-items:center; }
  .pager { display:flex; gap:.5rem; align-items:center; margin-top:1rem; }
  .toolbar { display:flex; gap:.6rem; align-items:center; margin-bottom:1rem; flex-wrap:wrap; }
  .search { flex:1 1 220px; max-width:340px; padding:.4rem .55rem; border:1px solid var(--line);
            border-radius:6px; background:var(--bg); color:var(--fg); font:inherit; }
  th a.sort { color:var(--muted); text-decoration:none; display:inline-block; }
  th a.sort:hover { color:var(--fg); }
  th a.sort.on { color:var(--fg); }
  th a.sort span { font-size:.75em; margin-left:.25em; }
  @media (max-width:640px) { th,td { max-width:12ch; } }
</style>
</head>
<body>
<header>
  <a class="home" href="{{ prefix }}">Data</a>
  {% for slug, r in resources.items() %}<a href="{{ prefix }}/{{ slug }}">{{ r.label }}</a>{% endfor %}
  <span class="who">
    {{ user }}
    {% if not proxy_auth and user %}
      <form method="post" action="{{ prefix }}/logout" style="display:inline">
        <button class="btn" style="padding:.15rem .5rem">Sign out</button>
      </form>
    {% endif %}
  </span>
</header>
<main>{% block body %}{% endblock %}</main>
</body>
</html>

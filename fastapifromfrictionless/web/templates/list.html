{% extends "base.html" %}
{% block title %}{{ res.label }}{% endblock %}
{% block body %}
<h1>{{ res.label }} <span class="muted" style="font-weight:400;font-size:.8em">{{ "{:,}".format(total) }}</span></h1>
<div class="toolbar">
  <a class="btn primary" href="{{ prefix }}/{{ slug }}/new">New {{ res.label|lower }}</a>
  <input class="search" type="search" name="q" value="{{ q }}"
         placeholder="Filter {{ res.label|lower }}…" autocomplete="off"
         hx-get="{{ prefix }}/{{ slug }}"
         hx-trigger="input changed delay:300ms, search"
         hx-target="#table-wrap" hx-swap="outerHTML" hx-push-url="true"
         hx-include="[name='sort'],[name='dir']">
  <input type="hidden" name="sort" value="{{ sort }}">
  <input type="hidden" name="dir" value="{{ dir }}">
</div>
{% include "_table.html" %}
{% endblock %}

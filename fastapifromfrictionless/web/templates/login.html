{% extends "base.html" %}
{% block title %}Sign in{% endblock %}
{% block body %}
<h1>Sign in</h1>
{% if error %}<p class="err">{{ error }}</p>{% endif %}
<form method="post" action="{{ prefix }}/login" style="max-width:340px">
  <label for="api_key">API key</label>
  <input type="password" id="api_key" name="api_key" autofocus autocomplete="current-password">
  <div class="actions"><button class="btn primary" type="submit">Sign in</button></div>
</form>
{% endblock %}
